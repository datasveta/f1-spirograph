name: Update race data

on:
  schedule:
    # Sunday 22:00 UTC (after the race) and a Monday 07:00 UTC catch-up in
    # case the data source lagged.
    - cron: '0 22 * * 0'
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest winners and counts
        run: python3 scripts/update-data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/circuits.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/circuits.json
          git commit -m "Update race data"
          git push
